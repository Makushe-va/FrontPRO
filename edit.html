<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container py-5">
  <h1>Редагування товарів</h1>
  <form id="editForm" class="mt-4">
    <div class="mb-3">
      <label class="form-label">Назва</label>
      <input type="text" name="name" class="form-control" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Опис</label>
      <textarea name="description" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Ціна</label>
      <input type="number" name="price" class="form-control" min="0.01" step="0.01" required />
    </div>
    <button type="submit" class="btn btn-success">Зберігти</button>
    <a href="list.html" class="btn btn-secondary">Скасувати</a>
  </form>
</div>
<script src="/js/edit.js"></script>
</body>
</html>
