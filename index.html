<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">To-Do List</h1>
    <div class="input-group mb-3">
        <input type="text" id="taskInput" class="form-control" placeholder="New task">
        <button id="addBtn" class="btn btn-primary">Add</button>
    </div>
    <ul id="taskList" class="list-group mb-3"></ul>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-success">✅ Completed: <span id="doneCount">0</span></span>
        <span class="badge bg-warning text-dark">⏳ Active: <span id="activeCount">0</span></span>
    </div>
    <div class="btn-group w-100 filters">
        <button data-filter="all" class="btn btn-outline-secondary">All</button>
        <button data-filter="active" class="btn btn-outline-secondary">Active</button>
        <button data-filter="completed" class="btn btn-outline-secondary">Completed</button>
    </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
